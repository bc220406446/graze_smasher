<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1728" />
      <stop offset="50%" stop-color="#0f2744" />
      <stop offset="100%" stop-color="#16365c" />
    </linearGradient>

    <!-- Shield Primary Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Crimson Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Card Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Container -->
  <rect width="600" height="460" rx="20" fill="url(#bgGrad)" stroke="#23426b" stroke-width="1.5" />

  <!-- Subtle Tech Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="460" />
    <line x1="120" y1="0" x2="120" y2="460" />
    <line x1="200" y1="0" x2="200" y2="460" />
    <line x1="280" y1="0" x2="280" y2="460" />
    <line x1="360" y1="0" x2="360" y2="460" />
    <line x1="440" y1="0" x2="440" y2="460" />
    <line x1="520" y1="0" x2="520" y2="460" />
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="220" x2="600" y2="220" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="380" x2="600" y2="380" />
  </g>

  <!-- Central Radar Conic Circles -->
  <g transform="translate(300, 210)" opacity="0.35">
    <circle r="180" fill="none" stroke="#3b82f6" stroke-dasharray="6,8" stroke-width="1.2" />
    <circle r="130" fill="none" stroke="#60a5fa" stroke-width="1" />
    <circle r="85" fill="none" stroke="#93c5fd" stroke-dasharray="4,4" stroke-width="1" />
    <circle r="45" fill="none" stroke="#2563eb" stroke-width="1.5" />

    <!-- Radar Crosshairs -->
    <line x1="-190" y1="0" x2="190" y2="0" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,6" />
    <line x1="0" y1="-190" x2="0" y2="190" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,6" />

    <!-- Radar Sweep Effect -->
    <path d="M0,0 L120,-120 A170,170 0 0,0 0,-170 Z" fill="url(#shieldGrad)" opacity="0.12" />
  </g>

  <!-- Central AI Authenticity Shield -->
  <g transform="translate(300, 195)" filter="url(#softShadow)">
    <!-- Outer Glow -->
    <path d="M0 -65 L52 -38 L52 22 Q52 70 0 98 Q-52 70 -52 22 L-52 -38 Z" fill="#1e40af" opacity="0.4" filter="url(#glow)" />
    
    <!-- Main Shield Body -->
    <path d="M0 -60 L48 -35 L48 20 Q48 64 0 90 Q-48 64 -48 20 L-48 -35 Z" fill="url(#shieldGrad)" stroke="#93c5fd" stroke-width="2.5" />
    
    <!-- Shield Core Reflection -->
    <path d="M0 -55 L42 -32 L42 16 Q42 56 0 80 Q0 0 0 -55 Z" fill="#ffffff" opacity="0.16" />

    <!-- Crosshair Smasher Emblem -->
    <circle cx="0" cy="10" r="26" fill="#0f172a" stroke="#60a5fa" stroke-width="2" />
    <circle cx="0" cy="10" r="14" fill="#2563eb" />
    <circle cx="0" cy="10" r="6" fill="#ffffff" />
    
    <!-- Crosshair Target Pins -->
    <line x1="-32" y1="10" x2="-20" y2="10" stroke="#93c5fd" stroke-width="2.5" />
    <line x1="20" y1="10" x2="32" y2="10" stroke="#93c5fd" stroke-width="2.5" />
    <line x1="0" y1="-22" x2="0" y2="-10" stroke="#93c5fd" stroke-width="2.5" />
    <line x1="0" y1="30" x2="0" y2="42" stroke="#93c5fd" stroke-width="2.5" />
  </g>

  <!-- Neural Network Flow Nodes -->
  <g stroke="#3b82f6" stroke-width="1.5" opacity="0.6">
    <line x1="160" y1="110" x2="250" y2="160" stroke-dasharray="3,3" />
    <line x1="440" y1="110" x2="350" y2="160" stroke-dasharray="3,3" />
    <line x1="160" y1="310" x2="250" y2="250" stroke-dasharray="3,3" />
    <line x1="440" y1="310" x2="350" y2="250" stroke-dasharray="3,3" />
  </g>

  <!-- Node Circles -->
  <circle cx="250" cy="160" r="4" fill="#60a5fa" />
  <circle cx="350" cy="160" r="4" fill="#60a5fa" />
  <circle cx="250" cy="250" r="4" fill="#60a5fa" />
  <circle cx="350" cy="250" r="4" fill="#60a5fa" />

  <!-- Floating UI Card 1: Top Left - Fake Review Intercepted -->
  <g transform="translate(35, 60)" filter="url(#softShadow)">
    <rect width="210" height="92" rx="12" fill="#0f1f38" stroke="#ef4444" stroke-width="1.2" opacity="0.95" />
    <rect x="0" y="0" width="210" height="4" rx="2" fill="url(#crimsonGrad)" />
    
    <!-- Red Alert Icon -->
    <circle cx="28" cy="32" r="14" fill="#ef4444" opacity="0.2" />
    <circle cx="28" cy="32" r="7" fill="#ef4444" />
    <path d="M28 28 L28 33 M28 36 L28 37" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

    <!-- Content -->
    <text x="50" y="28" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" letter-spacing="0.5">FAKE REVIEW BLOCKED</text>
    <text x="50" y="42" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">Bot Velocity Burst</text>
    
    <!-- Mini Metric Badge -->
    <rect x="18" y="58" width="85" height="22" rx="6" fill="#450a0a" stroke="#b91c1c" stroke-width="0.8" />
    <text x="26" y="73" fill="#f87171" font-family="'Courier New', monospace" font-size="11" font-weight="bold">99.2% Deceptive</text>

    <rect x="110" y="58" width="82" height="22" rx="6" fill="#1e293b" />
    <text x="118" y="73" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11">IP Flagged</text>
  </g>

  <!-- Floating UI Card 2: Top Right - ML Ensemble Confidence -->
  <g transform="translate(365, 55)" filter="url(#softShadow)">
    <rect width="200" height="95" rx="12" fill="#0f1f38" stroke="#2563eb" stroke-width="1.2" opacity="0.95" />
    <rect x="0" y="0" width="200" height="4" rx="2" fill="url(#shieldGrad)" />
    
    <!-- Brain / ML Icon -->
    <circle cx="26" cy="32" r="14" fill="#2563eb" opacity="0.25" />
    <circle cx="26" cy="32" r="8" fill="#3b82f6" />

    <!-- Content -->
    <text x="48" y="28" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" letter-spacing="0.5">DUAL-MODEL INFERENCE</text>
    <text x="48" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">LinearSVC + J-48 Tree</text>
    
    <!-- Latency & Score -->
    <text x="18" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Latency: <tspan fill="#38bdf8" font-family="'Courier New', monospace" font-weight="bold">12ms</tspan></text>
    <rect x="112" y="60" width="72" height="20" rx="10" fill="#1e3a8a" />
    <text x="122" y="74" fill="#93c5fd" font-family="'Courier New', monospace" font-size="10" font-weight="bold">ONLINE</text>
  </g>

  <!-- Floating UI Card 3: Bottom Right - Authentic Product Verified -->
  <g transform="translate(345, 290)" filter="url(#softShadow)">
    <rect width="225" height="120" rx="14" fill="#0b1f33" stroke="#10b981" stroke-width="1.4" opacity="0.96" />
    <rect x="0" y="0" width="225" height="4" rx="2" fill="url(#emeraldGrad)" />
    
    <!-- Emerald Verified Check Icon -->
    <circle cx="30" cy="32" r="15" fill="#10b981" opacity="0.25" />
    <circle cx="30" cy="32" r="10" fill="#10b981" />
    <path d="M26 32 L29 35 L35 29" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <text x="54" y="28" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" letter-spacing="0.5">VERIFIED PRODUCT</text>
    <text x="54" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">Authentic Sentiment</text>
    
    <!-- Progress Bar -->
    <rect x="18" y="60" width="190" height="6" rx="3" fill="#1e293b" />
    <rect x="18" y="60" width="176" height="6" rx="3" fill="url(#emeraldGrad)" />

    <div xmlns="http://www.w3.org/1999/xhtml"></div>
    <text x="18" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Authenticity Score:</text>
    <text x="156" y="85" fill="#34d399" font-family="'Courier New', monospace" font-size="12" font-weight="bold">92.4%</text>

    <!-- Star Community Trust -->
    <text x="18" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10">Trust: <tspan fill="#facc15">★</tspan> 4.8 / 5.0 (Recalculated)</text>
  </g>

  <!-- Floating UI Card 4: Bottom Left - Deception Radar Frequency -->
  <g transform="translate(35, 305)" filter="url(#softShadow)">
    <rect width="210" height="95" rx="12" fill="#0f1f38" stroke="#3b82f6" stroke-width="1.2" opacity="0.95" />
    <rect x="0" y="0" width="210" height="4" rx="2" fill="url(#shieldGrad)" />
    
    <text x="16" y="28" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" letter-spacing="0.5">RADAR SPECTRUM</text>
    <text x="16" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">NLP Polarity &amp; Star Delta</text>

    <!-- Wave Signal Bars -->
    <g transform="translate(16, 56)">
      <rect x="0" y="14" width="8" height="18" rx="2" fill="#3b82f6" opacity="0.6" />
      <rect x="12" y="8" width="8" height="24" rx="2" fill="#3b82f6" opacity="0.8" />
      <rect x="24" y="2" width="8" height="30" rx="2" fill="#60a5fa" />
      <rect x="36" y="10" width="8" height="22" rx="2" fill="#3b82f6" opacity="0.8" />
      <rect x="48" y="16" width="8" height="16" rx="2" fill="#3b82f6" opacity="0.6" />
      <rect x="60" y="4" width="8" height="28" rx="2" fill="#60a5fa" />
      <rect x="72" y="12" width="8" height="20" rx="2" fill="#3b82f6" opacity="0.7" />
      <rect x="84" y="18" width="8" height="14" rx="2" fill="#3b82f6" opacity="0.5" />
    </g>

    <text x="115" y="78" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11" font-weight="bold">LOW DELTA</text>
    <text x="115" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10">Zero Discrepancy</text>
  </g>

  <!-- Glowing Accent Dots -->
  <circle cx="295" cy="50" r="3" fill="#60a5fa" opacity="0.8" />
  <circle cx="315" cy="420" r="3" fill="#34d399" opacity="0.8" />
  <circle cx="560" cy="220" r="2.5" fill="#f87171" opacity="0.8" />
  <circle cx="20" cy="220" r="2.5" fill="#38bdf8" opacity="0.8" />
</svg>

