{% extends 'base.html' %}

{% block title %}Reset Password - Graze Smasher{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-header py-3 bg-white border-bottom text-center">
                    <h4 class="mb-0 fw-bold text-dark"><i class="fa-solid fa-key text-warning me-2"></i>Reset Password</h4>
                    <p class="text-muted small mb-0 mt-1">Enter your email to receive password reset instructions</p>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="id_email">Email Address</label>
                            <input type="email" name="email" required class="form-control" id="id_email" placeholder="name@example.com">
                        </div>
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary py-2 fw-semibold">
                                Send Reset Link
                            </button>
                        </div>
                        <div class="text-center small">
                            <a href="{% url 'login' %}" class="text-muted">Back to Log In</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
