{% extends 'base.html' %}

{% block title %}Set New Password - Graze Smasher{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm p-4">
                <h4 class="fw-bold mb-3">Set New Password</h4>
                {% if validlink %}
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-grid mt-3">
                            <button type="submit" class="btn btn-primary">Update Password</button>
                        </div>
                    </form>
                {% else %}
                    <div class="alert alert-danger">
                        The password reset link was invalid or has expired.
                    </div>
                    <a href="{% url 'password_reset' %}" class="btn btn-outline-secondary">Request New Reset Link</a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
