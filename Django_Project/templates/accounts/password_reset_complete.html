{% extends 'base.html' %}

{% block title %}Password Reset Complete - Graze Smasher{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 text-center">
            <div class="card shadow-sm p-4">
                <div class="mb-3">
                    <i class="fa-solid fa-circle-check text-success fs-1"></i>
                </div>
                <h4 class="fw-bold">Password Reset Complete</h4>
                <p class="text-muted small">
                    Your password has been changed successfully. You can now log in using your new credentials.
                </p>
                <a href="{% url 'login' %}" class="btn btn-primary mt-2">Log In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
