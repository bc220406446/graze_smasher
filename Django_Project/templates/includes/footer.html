{% load static %}
<!-- Standardized Brand Footer Include (Mirrors Public Header Layout & Spacing) -->
<footer class="gs-footer border-top bg-white">
    <div class="container-fluid px-lg-4 d-flex justify-content-between align-items-center">
        <!-- Left: Logo & Copyright -->
        <div class="d-flex align-items-center">
            <a class="gs-brand d-inline-flex align-items-center text-decoration-none py-1" href="{% url 'home' %}">
                <img src="{% static 'img/logo.png' %}" alt="Graze Smasher" style="height: 28px; width: auto; object-fit: contain;">
            </a>
            <span class="text-muted small ms-3 ps-3 border-start d-none d-sm-inline">
                AI Powered Fake Review Detection & Product Hunting &copy; 2026
            </span>
        </div>

        <!-- Right: Privacy Policy Link -->
        <div class="d-flex align-items-center">
            <a href="{% url 'privacy_policy' %}" class="text-decoration-none text-muted small">
                Privacy & Data Policy
            </a>
        </div>
    </div>
</footer>
