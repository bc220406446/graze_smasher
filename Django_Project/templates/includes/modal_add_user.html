<!-- Add New User Modal (Shared) -->
<div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <form action="{% url 'admin_add_user' %}" method="POST">
                {% csrf_token %}
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold" id="addUserModalLabel" style="color: #ffffff !important;">
                        <i class="fa-solid fa-user-plus me-2 text-white"></i> Create Platform User
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 text-start">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark">Full Name <span class="text-danger">*</span></label>
                        <input type="text" name="full_name" class="form-control" placeholder="e.g. Alex Morgan" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark">Email Address <span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control" placeholder="alex.morgan@example.com" required>
                        <div class="form-text small">Used as the unique account username and login credential.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark">Account Role <span class="text-danger">*</span></label>
                        <select name="role" class="form-select" required>
                            <option value="general" selected>General User (Registers products &amp; monitors alerts)</option>
                            <option value="reviewer">Reviewer (Evaluates products &amp; submits reviews for ML detection)</option>
                        </select>
                        <div class="form-text small">Role is fixed upon creation to maintain catalog domain integrity.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark">Initial Password <span class="text-danger">*</span></label>
                        <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-outline-secondary btn-sm px-3" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm px-4 fw-semibold">
                        <i class="fa-solid fa-check me-1"></i> Create User
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
