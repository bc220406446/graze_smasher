<!-- Edit User Modal (Shared) -->
<!-- Expected context variable: u (User instance) -->
<div class="modal fade" id="editUserModal{{ u.id }}" tabindex="-1" aria-labelledby="editUserModalLabel{{ u.id }}" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <form action="{% url 'admin_edit_user' u.id %}" method="POST">
                {% csrf_token %}
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold" id="editUserModalLabel{{ u.id }}" style="color: #ffffff !important;">
                        <i class="fa-solid fa-user-pen me-2 text-white"></i> Edit User: {{ u.get_full_name|default:u.username }}
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 text-start">
                    <!-- Full Name -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark">Full Name <span class="text-danger">*</span></label>
                        <input type="text" name="full_name" class="form-control" value="{{ u.get_full_name|default:u.first_name }}" required>
                    </div>

                    <!-- Email Address -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark">Email Address <span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control" value="{{ u.email }}" required>
                        <div class="form-text small">Also updates the account username credential.</div>
                    </div>

                    <!-- Reset Password (Optional) -->
                    <div class="mb-2">
                        <label class="form-label fw-semibold text-dark">Reset Password <small class="text-muted font-monospace">(Optional)</small></label>
                        <input type="password" name="new_password" class="form-control" placeholder="Leave blank to keep current password" minlength="6">
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-outline-secondary btn-sm px-3" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm px-4 fw-semibold">
                        <i class="fa-solid fa-check me-1"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
