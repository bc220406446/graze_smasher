<!-- Flag / Report Content Modal (Shared) -->
<div class="modal fade" id="flagReviewModal" tabindex="-1" aria-labelledby="flagReviewModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow">
            <div class="modal-header border-bottom">
                <h5 class="modal-title fw-bold" id="flagReviewModalLabel">
                    <i class="fa-solid fa-flag text-danger me-2"></i>Report Content
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <p class="text-muted small mb-3">
                    Submit this review or product to the administrative moderation team for manual review and re-scoring.
                </p>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Reason for Reporting</label>
                    <select class="form-select form-select-sm" id="flagReasonSelect">
                        <option value="fake">Bot-generated or synthetic review</option>
                        <option value="spam">Commercial advertisement or promotional spam</option>
                        <option value="velocity">Sudden review burst or astroturfing</option>
                        <option value="inappropriate">Inappropriate or abusive language</option>
                        <option value="other">Other policy violation</option>
                    </select>
                </div>
                <div class="mb-0">
                    <label class="form-label small fw-semibold text-secondary">Additional Context (Optional)</label>
                    <textarea class="form-control form-control-sm" id="flagNotesText" rows="3" placeholder="Provide any details to assist moderators..."></textarea>
                </div>
            </div>
            <div class="modal-footer border-top bg-light">
                <button type="button" class="btn btn-outline-secondary btn-sm px-3" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger btn-sm px-3 fw-semibold" id="submitFlagModalBtn">Submit Report</button>
            </div>
        </div>
    </div>
</div>
