<!-- Generic Confirmation / Action Modal (Shared) -->
<div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="confirmationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow">
            <div class="modal-header border-bottom">
                <h5 class="modal-title fw-bold" id="confirmationModalLabel">
                    <i class="fa-solid fa-triangle-exclamation text-warning me-2"></i>Confirm Action
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4" id="confirmationModalBody">
                Are you sure you want to proceed with this action? This operation cannot be undone.
            </div>
            <div class="modal-footer border-top bg-light">
                <button type="button" class="btn btn-outline-secondary btn-sm px-3" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger btn-sm px-3 fw-semibold" id="confirmActionBtn">Confirm</button>
            </div>
        </div>
    </div>
</div>
