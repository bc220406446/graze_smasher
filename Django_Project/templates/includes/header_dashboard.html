{% load static %}
<!-- Dashboard Navigation Header (Icon Name Left side return to home page logout) -->
<header class="gs-navbar sticky-top bg-white border-bottom shadow-xs">
    <div class="container-fluid px-2 px-sm-3 px-lg-4 d-flex justify-content-between align-items-center">
        <!-- Left Side: Mobile Sidebar Toggle + Brand (Logo) -->
        <div class="d-flex align-items-center gap-1 gap-sm-2 gap-md-3 min-w-0">
            <!-- Mobile Sidebar Toggle -->
            <button class="btn btn-outline-secondary btn-sm gs-btn-icon d-lg-none flex-shrink-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar" aria-controls="mobileSidebar" aria-label="Toggle Dashboard Menu">
                <i class="fa-solid fa-bars"></i>
            </button>

            <!-- Brand: Logo -->
            <a class="gs-brand d-inline-flex align-items-center text-decoration-none py-1 flex-shrink-0" href="{% url 'home' %}">
                <img src="{% static 'img/logo.png' %}" alt="Graze Smasher" class="gs-header-logo">
            </a>
        </div>

        <!-- Right Side: Return to Home Page + Logout -->
        <div class="d-flex align-items-center gap-1 gap-sm-2 flex-shrink-0">
            <!-- Mobile: Home Icon -->
            <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm gs-btn-icon d-inline-flex d-md-none" title="Return to Home Page" aria-label="Home">
                <i class="fa-solid fa-house"></i>
            </a>
            <!-- Desktop / Tablet: Full Return to Home Button -->
            <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm d-none d-md-inline-flex align-items-center gap-1 px-3 text-nowrap" title="Return to Home Page">
                <i class="fa-solid fa-house"></i>
                <span>Return to Home Page</span>
            </a>

            <!-- Mobile: Logout Icon -->
            <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm gs-btn-icon d-inline-flex d-sm-none" title="Logout" aria-label="Logout">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </a>
            <!-- Desktop / Tablet: Full Logout Button -->
            <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm d-none d-sm-inline-flex align-items-center gap-1 px-3 fw-medium text-nowrap">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span>Logout</span>
            </a>
        </div>
    </div>
</header>
